<!doctype html>
<!-- Inner frame for iframe.html spike test — same-origin child frame -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>iframe-inner</title>
  <style>
    body { font-family: monospace; margin: 8px 12px; background: #fafafa; font-size: 12px; }
    video { display: block; width: 100%; background: #000; }
  </style>
</head>
<body>
  <p style="margin:0 0 6px;color:#555;">Same-origin inner frame — video (MDN CC0):</p>
  <video controls crossorigin="anonymous"
    src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"
    height="120">
  </video>
  <script>
    // spike-probe.js (injected by extension) sends anyspeedSpike postMessage to parent
    // This page's own script also reports its rate so iframe.html's log is populated even
    // without the extension installed.
    const v = document.querySelector("video");
    v.addEventListener("ratechange", () => {
      parent.postMessage({ frame: location.href, ratechange: v.playbackRate }, "*");
    });
    window.addEventListener("load", () => {
      parent.postMessage({ frame: location.href, rate: v.playbackRate }, "*");
    });
  </script>
</body>
</html>
